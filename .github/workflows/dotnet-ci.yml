
name: .NET CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.317'

      - name: Restore dependencies
        run: dotnet restore BookingRules.sln

      - name: Build solution
        run: dotnet build BookingRules.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test BookingRules.sln --configuration Release --no-build --logger "console;verbosity=normal"
